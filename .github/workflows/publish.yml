name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/, 'Use a stable version tag such as v0.1.0');
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Release tag must match package.json');
          assert.equal(lock.version, pkg.version, 'Lockfile version must match package.json');
          assert.equal(lock.packages[''].version, pkg.version, 'Lockfile package version must match package.json');
          NODE

      - name: Install publishing tools and dependencies
        run: |
          npm install --global npm@11
          npm ci --ignore-scripts

      # prepublishOnly runs syntax checks and tests before the upload.
      - name: Test and publish with npm trusted publishing
        run: npm publish --access public
